# 週次ジョブ: 週1回、その週の投稿結果を集計してAIに方針を見直させる。
# aggregate.py の標準出力を、そのままパイプで review.py の標準入力に渡す。

name: weekly

on:
  schedule:
    - cron: '0 18 * * 0'   # 毎週月曜 03:00 JST (= 日曜 18:00 UTC)
  workflow_dispatch:

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 集計してAIに方針を見直させる (aggregate.py -> review.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/aggregate.py | python scripts/review.py
